name: No private secrets

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure public tunnel assets
        run: bash tools/ensure-public-tunnel-assets.sh
      - name: Scan repo for private Cloudflare / personal links
        run: bash tools/check-no-private-secrets.sh
