<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jumelage caméra</title>
<link rel="stylesheet" href="/style.css?v=53">
</head>
<body class="live-page">
<div class="wrap">
  <h1>Jumelage caméra</h1>
  <div class="row">
    <button id="homeBtn" type="button" class="ghost" style="flex:1;margin-top:0">Accueil</button>
    <button id="leaveBtn" type="button" class="danger" style="flex:1;margin-top:0">Déconnecté</button>
  </div>
  <p id="scanHint" class="hint">Vise le QR affiché sur la tablette principale.</p>
  <video id="preview" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;"></video>
  <p class="hint">Ou colle le lien</p>
  <input id="manualUrl" placeholder="https://…" style="width:100%;padding:10px;border-radius:10px;">
  <button id="manualGo" type="button">Ouvrir</button>
</div>
<script>
const hint = document.getElementById('scanHint');
const video = document.getElementById('preview');
function stopPreview() {
  const stream = video && video.srcObject;
  if (stream && stream.getTracks) stream.getTracks().forEach((t) => t.stop());
  if (video) video.srcObject = null;
}
function goHome() {
  stopPreview();
  if (window.GamelleHost && GamelleHost.postMessage) GamelleHost.postMessage('home');
  else history.back();
}
document.getElementById('homeBtn').onclick = goHome;
document.getElementById('leaveBtn').onclick = goHome;
function openUrl(url) {
  const clean = String(url || '').trim();
  if (!clean.startsWith('http')) return;
  if (window.GamelleHost && GamelleHost.postMessage) GamelleHost.postMessage('join|' + clean);
  else location.href = clean;
}
document.getElementById('manualGo').onclick = () => openUrl(document.getElementById('manualUrl').value);
(async function () {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    if (!('BarcodeDetector' in window)) {
      hint.textContent = 'Scan automatique indisponible. Colle le lien affiché sous le code.';
      return;
    }
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const tick = async () => {
      try {
        const codes = await det.detect(video);
        if (codes && codes[0] && codes[0].rawValue) {
          openUrl(codes[0].rawValue);
          return;
        }
      } catch (e) {}
      setTimeout(tick, 400);
    };
    tick();
  } catch (e) {
    hint.textContent = 'Caméra refusée. Colle le lien.';
  }
})();
</script>
</body>
</html>
