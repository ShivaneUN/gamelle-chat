<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Gamelle Chat</title>
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Gamelle Chat">
<meta property="og:description" content="Pilote la gamelle à distance.">
<meta property="og:image" content="/logo.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/logo.png">
<link rel="stylesheet" href="/style.css?v=40">
</head>
<body>
<div class="wrap center">
  <h1>🐾 Gamelle Chat</h1>
  <p class="muted">Ouverture du contrôleur…</p>
</div>
<script>
(async function openController() {
  for (;;) {
    try {
      const j = await fetch('/api/active-code').then((r) => r.json());
      const code = j && j.code ? String(j.code).trim() : '';
      if (code.length >= 4) {
        try { sessionStorage.setItem('gamellePairCode', code); } catch (e) {}
        try { localStorage.setItem('gamellePairCode', code); } catch (e) {}
        location.replace('/controller.html');
        return;
      }
    } catch (e) {}
    try {
      const info = await fetch('/api/info').then((r) => r.json());
      const code = info && info.pairCode ? String(info.pairCode).trim() : '';
      if (code.length >= 4) {
        try { sessionStorage.setItem('gamellePairCode', code); } catch (e) {}
        try { localStorage.setItem('gamellePairCode', code); } catch (e) {}
        location.replace('/controller.html');
        return;
      }
    } catch (e) {}
    await new Promise((r) => setTimeout(r, 800));
  }
})();
</script>
</body>
</html>
