<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Gamelle Chat — Connexion</title>
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Gamelle Chat">
<meta property="og:description" content="Pilote la gamelle à distance.">
<meta property="og:image" content="/logo.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/logo.png">
<link rel="stylesheet" href="/style.css?v=43">
</head>
<body>
<div class="wrap center">
  <h1>Gamelle Chat</h1>
  <p class="muted">Connexion contrôleur</p>
  <form id="loginForm" method="POST" action="/api/auth/login" autocomplete="off" class="card" style="max-width:360px;margin:20px auto;text-align:left;padding:20px;">
    <label class="hint" for="gamelleUser">Identifiant</label>
    <input id="gamelleUser" name="username" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required
      style="width:100%;margin:6px 0 14px;padding:12px;border-radius:12px;border:0;background:#1C2030;color:#fff;">
    <label class="hint" for="gamellePass">Mot de passe</label>
    <div style="position:relative;margin:6px 0 14px;">
      <input id="gamellePass" name="password" type="password" autocomplete="off" autocorrect="off" spellcheck="false" required
        style="width:100%;padding:12px 44px 12px 12px;border-radius:12px;border:0;background:#1C2030;color:#fff;">
      <button id="togglePass" type="button" class="chip-btn" title="Afficher / masquer"
        style="position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;">•••</button>
    </div>
    <p id="loginError" class="hint" style="color:#FF7A45;min-height:1.2em;"><!--LOGIN_ERROR--></p>
    <button id="loginBtn" class="chip-btn toggle-on" type="submit" style="width:100%;justify-content:center;">Se connecter</button>
  </form>
  <p class="muted" style="font-size:13px;">Même identifiant et mot de passe que dans Comptes sur la tablette.</p>
  <p class="muted" style="font-size:12px;">Serveur <!--SERVER_VER--></p>
</div>
<script>
(function () {
  try { localStorage.removeItem('gamelleSession'); } catch (e) {}
  var form = document.getElementById('loginForm');
  var userEl = document.getElementById('gamelleUser');
  var passEl = document.getElementById('gamellePass');
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  var toggle = document.getElementById('togglePass');
  function existingToken() {
    try { return sessionStorage.getItem('gamelleSession') || ''; } catch (e) { return ''; }
  }
  if (toggle && passEl) {
    toggle.addEventListener('click', function () {
      var show = passEl.type === 'password';
      passEl.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'ABC' : '•••';
    });
  }
  var kept = existingToken();
  if (kept) {
    fetch('/api/auth/me', {
      credentials: 'same-origin',
      headers: { Authorization: 'Bearer ' + kept, Accept: 'application/json' }
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.authenticated) location.replace('/controller.html?access=' + encodeURIComponent(kept));
      else try { sessionStorage.removeItem('gamelleSession'); } catch (e) {}
    }).catch(function () {});
  }
  if (!form) return;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var username = String(userEl && userEl.value || '').trim();
    var password = String(passEl && passEl.value || '');
    if (!username || !password) {
      if (errEl) errEl.textContent = 'Identifiant et mot de passe requis.';
      return;
    }
    if (btn) btn.disabled = true;
    fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; }).catch(function () { return { ok: false, j: {} }; });
    }).then(function (res) {
      var j = res.j || {};
      if (!res.ok || !j.ok || !j.token) {
        if (errEl) errEl.textContent = j.error || 'Le serveur a refusé la connexion.';
        if (btn) btn.disabled = false;
        return;
      }
      try { sessionStorage.setItem('gamelleSession', j.token); } catch (err) {}
      try { localStorage.removeItem('gamelleSession'); } catch (err) {}
      if (passEl) passEl.value = '';
      location.replace('/controller.html?access=' + encodeURIComponent(j.token));
    }).catch(function () {
      if (errEl) errEl.textContent = 'Impossible de joindre le serveur';
      if (btn) btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
